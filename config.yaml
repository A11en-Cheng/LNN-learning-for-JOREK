# HyPhy-GLNN Configuration File

data:
  # data_dir: "data/test_data_for_ITER_SPI_fast"
  data_dir: "data/test_data_for_BEST"
  output_dir: "output/interpolation_test_BEST"
  model_dir: "output/interpolation_test_BEST/checkpoints"
  vis_dir: "output/interpolation_test_BEST/vis"

pretrained:
  # Set to a valid path to load an existing model, or null to train from scratch
  # Example: "output/interpolation_test/checkpoints/encoder_epoch_3000.pth"
  encoder: "output/interpolation_test_BEST/checkpoints_good_1750/model_epoch_500.pt"
  processor: "output/interpolation_test_BEST/checkpoints_good_1750/model_epoch_500.pt"
  decoder: "output/interpolation_test_BEST/checkpoints_good_1750/model_epoch_500.pt"

training:
  batch_size: 3
  seq_len: 6
  epochs: 1500
  lr: 0.0005
  weight_decay: 0.00001
  num_workers: 4

model:
  input_dim: 9
  output_dim: 9
  hidden_dim: 64
  latent_dim: 32
  encoder_layers: 4
  processor_layers: 2
  decoder_layers: 4

physics:
  lambda_data: 1.0
  lambda_phys_max: 1.e-5
  phys_warmup_epochs: 0
  phys_anneal_epochs: 1000
  dt: 1.0
