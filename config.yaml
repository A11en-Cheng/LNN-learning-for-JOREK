# HyPhy-GLNN Configuration File
#
# RETIRED (v1 route, 2026-10-04): this file describes the retired nine-field /
# teacher-source pipeline. New architecture work follows roadmap_v2.md and
# docs/adr/0018 / 0019; do not reuse these values as defaults for new experiments.

data:
  # Model 502 only. BEST is Model 600/8-field data and is intentionally excluded.
  data_dir: "data/EHL-2/scan_1d22_ang12_massloss_neon"
  output_dir: "output/model502_baseline"
  model_dir: "output/model502_baseline/checkpoints"
  vis_dir: "output/model502_baseline/vis"
  require_source: false  # true only when every frame follows the source contract

pretrained:
  # Set to a valid path to load an existing model, or null to train from scratch
  # Example: "output/interpolation_test/checkpoints/encoder_epoch_3000.pth"
  encoder: null
  processor: null
  decoder: null

training:
  batch_size: 3
  seq_len: 6
  epochs: 1500
  lr: 0.0005
  weight_decay: 0.00001
  num_workers: 4

model:
  input_dim: 9
  output_dim: 9
  hidden_dim: 64
  latent_dim: 32
  encoder_layers: 4
  processor_layers: 2
  decoder_layers: 4
  source_dim: 3
  checkpoint: true  # gradient-equivalent activation savings; see tests/legacy/test_checkpointing.py (v1)

schema:
  version: "model502-state-v1"
  model_id: 502
  state_fields: [psi, Phi, Z_j, omega, rho, T_i, v_par, rho_imp, T_e]
  source_fields: [S_rho, S_T_i, S_T_e]
  condition_fields: [eta, visco, ZK_perp, ZK_par]

physics:
  lambda_data: 1.0
  lambda_phys_max: 1.e-5
  phys_warmup_epochs: 0
  phys_anneal_epochs: 1000
  dt: 1.0
