# HyPhy-GLNN Configuration File

data:
  data_dir: "data/test_data_for_ITER_SPI_fast"
  output_dir: "output/interpolation_test_ITER"
  model_dir: "output/interpolation_test_ITER/checkpoints"
  vis_dir: "output/interpolation_test_ITER/vis"

pretrained:
  # Set to a valid path to load an existing model, or null to train from scratch
  # Example: "output/interpolation_test/checkpoints/encoder_epoch_3000.pth"
  encoder: null
  processor: null
  decoder: null

training:
  batch_size: 4
  seq_len: 5
  epochs: 3000
  lr: 0.0005
  weight_decay: 0.00001
  num_workers: 4

model:
  input_dim: 5
  hidden_dim: 64
  latent_dim: 32
  encoder_layers: 4
  processor_layers: 2
  decoder_layers: 4

physics:
  lambda_data: 1.0
  lambda_phys_max: 0.005
  phys_warmup_epochs: 1000
  phys_anneal_epochs: 1500
  dt: 1.0
